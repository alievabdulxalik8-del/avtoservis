<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Электронная запись</title>
<style>
:root{--ink:#101820;--ink-2:#4A5964;--paper:#E8ECEF;--card:#fff;--line:#D4DBE0;
--blue:#17549E;--blue-bg:#E4EDF9;--amber:#B9740A;--amber-bg:#FCEFD8;
--green:#1B7048;--green-bg:#DDF0E6;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin-bottom:2px}
.sub{color:var(--ink-2);font-size:14px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.pad{padding:18px}
.hd{padding:13px 16px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.n{width:32px;height:32px;border-radius:9px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 32px}
.n.work{background:var(--amber-bg);color:var(--amber)}
.n.done{background:var(--green-bg);color:var(--green)}
.nm{font-weight:700;font-size:15px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.p-wait{background:var(--blue-bg);color:var(--blue)}
.p-work{background:var(--amber-bg);color:var(--amber)}
.p-done{background:var(--green-bg);color:var(--green)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.info{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:14px 16px}
.info svg{flex:0 0 20px;margin-top:2px;stroke:var(--blue);fill:none;stroke-width:1.8}
label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:13px;background:var(--card)}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
button{width:100%;font:inherit;font-size:17px;font-weight:700;padding:14px;border-radius:11px;border:none;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.linkbtn{background:none;color:var(--blue);font-weight:700;font-size:14px;text-decoration:underline;padding:8px;width:auto}
.err{color:#B02A2A;font-size:13px;margin-bottom:10px;display:none}
.done{text-align:center;padding:8px 4px}
.done .num{width:76px;height:76px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done h2{font-size:19px;margin-bottom:6px}
.done p{color:var(--ink-2);font-size:14px;margin-bottom:14px}
.refresh{font-size:12px;color:var(--ink-2);text-align:center;margin-top:-8px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="shopName">Автосервис</h1>
  <div class="sub" id="shopSub">электронная очередь</div>

  <div class="card">
    <div class="info" id="infoBlock"></div>
  </div>

  <div class="card">
    <div class="hd"><span>Кто сейчас в записи</span><span id="qCount"></span></div>
    <div id="qList"></div>
  </div>
  <div class="refresh" id="refreshTxt">видно машину, проблему, дату и последние 2 цифры телефона — так вы найдёте себя, не видя чужих данных</div>

  <div class="card" id="form-card">
    <div class="pad">
      <label style="font-size:16px;margin-bottom:12px">Записаться</label>
      <div class="err" id="err"></div>
      <input id="name" placeholder="Ваше имя">
      <input id="phone" type="tel" placeholder="Телефон">
      <input id="car" placeholder="Марка авто (необязательно)">
      <textarea id="what" rows="2" placeholder="Что случилось (необязательно)"></textarea>
      <label>Когда</label>
      <input id="bdate" type="date">
      <button id="submitBtn" onclick="submitForm()">Записаться</button>
    </div>
  </div>

  <div class="card" id="done-card" style="display:none">
    <div class="pad done">
      <div class="num" id="posNum">—</div>
      <h2 id="doneH2">Вы записаны</h2>
      <p id="doneTxt">Ваша позиция в очереди</p>
      <button class="linkbtn" onclick="showForm()" id="againBtn">Записать ещё одного</button>
    </div>
  </div>
</div>

<script>
var BASE_URL = 'https://script.google.com/macros/s/AKfycbyW17fICbE-GjMS_jMk9OaAVlONZEuKCWqsFUKB86emJzqq1WEtpUuEqTT15waLVGiAHQ/exec';
var LKEY = 'client_bookings_v2';
var DEVICE_CAP = 3;
var submitting = false;

function esc(s){return String(s==null?'':s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
function iso(d){var x=d||new Date();return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function uid(){return 'c'+Date.now()+Math.floor(Math.random()*900+100)}
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function ruDate(ds){
  var t=iso(),tm=iso(new Date(Date.now()+864e5));
  if(ds===t)return 'сегодня';
  if(ds===tm)return 'завтра';
  var d=new Date(ds+'T00:00:00');
  return d.getDate()+' '+MONTHS[d.getMonth()];
}

function myBookings(){try{return JSON.parse(localStorage.getItem(LKEY)||'[]')}catch(e){return []}}
function saveAll(a){try{localStorage.setItem(LKEY,JSON.stringify(a))}catch(e){}}
function lastBooking(){var a=myBookings();return a.length?a[a.length-1]:null}
function upsertBooking(oldDate,date,id,pos){
  var a=myBookings();
  if(oldDate){
    var i=a.findIndex(function(b){return b.date===oldDate});
    if(i>=0){a[i]={date:date,id:id,pos:pos};saveAll(a);return}
  }
  a.push({date:date,id:id,pos:pos});saveAll(a);
}
function removeBooking(date){saveAll(myBookings().filter(function(b){return b.date!==date}))}

function showDone(b){
  document.getElementById('form-card').style.display='none';
  document.getElementById('done-card').style.display='block';
  document.getElementById('posNum').textContent=(b.pos&&b.pos!=='…')?b.pos:'—';
  document.getElementById('doneH2').textContent=b.pos==='…'?'Записываем…':'Вы записаны';
  document.getElementById('doneTxt').textContent='Ваша позиция в очереди на '+ruDate(b.date);
  document.getElementById('againBtn').style.display=myBookings().length<DEVICE_CAP?'block':'none';
}
function showForm(){
  document.getElementById('form-card').style.display='block';
  document.getElementById('done-card').style.display='none';
  document.getElementById('err').style.display='none';
}
function refreshView(){
  var b=lastBooking();
  if(b)showDone(b);else showForm();
}

/** Сверяем каждую свою запись с живой лентой. Если её там больше нет — значит мастер
 *  закрыл работу («Готово») или запись удалили — освобождаем слот для новой записи. */
function checkMyBooking(feed){
  var mine=myBookings(),changed=false;
  mine.forEach(function(b){
    var stillActive=feed.some(function(x){return x.id===b.id;});
    if(!stillActive){removeBooking(b.date);changed=true}
    else{
      var sameDay=feed.filter(function(x){return x.date===b.date;});
      var idx=sameDay.findIndex(function(x){return x.id===b.id;});
      if(idx>=0&&idx+1!==b.pos){upsertBooking(b.date,b.date,b.id,idx+1);changed=true}
    }
  });
  if(changed)refreshView();
}

function render(data){
  var info=data.info||{};
  document.getElementById('shopName').textContent=info.name||'Автосервис';
  document.getElementById('shopSub').textContent=info.hours?('работаем: '+info.hours):'электронная очередь';
  var infoHtml='';
  if(info.hours)infoHtml+='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>Часы работы</b><br>'+esc(info.hours)+'</div>';
  if(info.phone)infoHtml+='</div><div class="info" style="border-top:1px solid var(--line)"><svg viewBox="0 0 24 24"><path d="M4 5c0 8 7 15 15 15l3-4-6-2-2 2c-3-1-6-4-7-7l2-2-2-6z"/></svg><div><b>Телефон</b><br><a href="tel:'+esc(info.phone)+'" style="color:var(--blue);text-decoration:none">'+esc(info.phone)+'</a></div>';
  document.getElementById('infoBlock').innerHTML=infoHtml||'<div>Добро пожаловать! Запишитесь ниже.</div>';

  var feed=data.feed||[];
  var qEl=document.getElementById('qList');
  document.getElementById('qCount').textContent=feed.length?('всего: '+feed.length):'';
  var lbl={wait:'Ждёт',work:'В работе',done:'Готово'},cl={wait:'',work:'work',done:'done'},pl={wait:'p-wait',work:'p-work',done:'p-done'};
  if(!feed.length){qEl.innerHTML='<div class="empty">Пока никто не записан — вы можете быть первым</div>'}
  else{
    qEl.innerHTML=feed.map(function(c){
      var s=c.status||'wait';
      var title=(c.car||'Авто')+(c.what?' · '+c.what:'');
      return '<div class="row"><div class="n '+cl[s]+'">··'+esc(c.last2||'--')+'</div>'+
        '<div style="flex:1"><div class="nm">'+esc(title)+'</div>'+
        '<div style="font-size:12px;color:var(--ink-2);margin-top:1px">'+ruDate(c.date)+'</div></div>'+
        '<span class="pill '+pl[s]+'">'+lbl[s]+'</span></div>';
    }).join('');
  }
  checkMyBooking(feed);
}

function loadToday(){
  if(!BASE_URL||BASE_URL.indexOf('exec')<0){
    document.getElementById('qList').innerHTML='<div class="empty">Страница не подключена к базе</div>';return;
  }
  fetch(BASE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({board:true})})
    .then(function(r){return r.json()})
    .then(function(res){if(res&&res.ok)render(res)})
    .catch(function(){});
}
loadToday();setInterval(loadToday,15000);
document.getElementById('bdate').value=iso();
document.getElementById('bdate').min=iso();
refreshView();

function submitForm(){
  if(submitting)return;
  var name=document.getElementById('name').value.trim();
  var phone=document.getElementById('phone').value.trim();
  var day=document.getElementById('bdate').value||iso();
  var err=document.getElementById('err');
  if(!name||!phone){err.textContent='Заполните имя и телефон.';err.style.display='block';return}
  if(!BASE_URL||BASE_URL.indexOf('exec')<0){err.textContent='Запись временно недоступна.';err.style.display='block';return}
  if(myBookings().length>=DEVICE_CAP){
    err.textContent='С этого устройства уже сделано '+DEVICE_CAP+' записи. Для новой — обратитесь в мастерскую напрямую.';
    err.style.display='block';return;
  }
  err.style.display='none';

  var id=uid();
  var rec={id:id,name:name,phone:phone,car:document.getElementById('car').value.trim(),
    plate:'',date:day,time:'',what:document.getElementById('what').value.trim(),
    status:'wait',ord:Date.now(),updated:Date.now(),deleted:0};

  doSubmit(rec,day,id,false);
}

function doSubmit(rec,day,id,confirmMove){
  submitting=true;
  var err=document.getElementById('err');
  var btn=document.getElementById('submitBtn');
  if(btn){btn.disabled=true;btn.textContent='Записываем…'}
  if(!confirmMove){
    upsertBooking(null,day,id,'…');
    showDone({date:day,pos:'…'});
  }
  var body={board:true,date:day,queue:[Object.assign({},rec,{confirmMove:!!confirmMove})]};

  fetch(BASE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){return r.json()})
    .then(function(res){
      if(!res||!res.ok)throw new Error('fail');

      if(res.conflicts&&res.conflicts[id]){
        if(!confirmMove)removeBooking(day);
        submitting=false;
        if(btn){btn.disabled=false;btn.textContent='Записаться'}
        var conf=res.conflicts[id],oldDay=conf.date;
        upsertBooking(null,oldDay,conf.id,null);
        var ok=confirm('У вас уже есть запись на '+ruDate(oldDay)+'. Перенести её на '+ruDate(day)+'?');
        if(ok){doSubmit(rec,day,id,true)}
        else{showDone({date:oldDay,pos:null});fetchPosFor(oldDay,conf.id)}
        return;
      }

      var q=res.queue||[];
      var realId=(res.idMap&&res.idMap[id])?res.idMap[id]:id;
      var pos=q.length;
      for(var i=0;i<q.length;i++){if(q[i].id===realId){pos=i+1;break}}
      if(confirmMove){
        var moved=myBookings().find(function(b){return b.id===realId});
        upsertBooking(moved?moved.date:null,day,realId,pos);
      } else {
        upsertBooking(null,day,realId,pos);
      }
      submitting=false;
      if(btn){btn.disabled=false;btn.textContent='Записаться'}
      document.getElementById('name').value='';document.getElementById('phone').value='';
      document.getElementById('car').value='';document.getElementById('what').value='';
      showDone({date:day,pos:pos});
      loadToday();
    })
    .catch(function(){
      if(!confirmMove)removeBooking(day);
      submitting=false;
      if(btn){btn.disabled=false;btn.textContent='Записаться'}
      showForm();
      err.textContent='Не удалось отправить. Проверьте связь и попробуйте ещё раз.';err.style.display='block';
    });
}

function fetchPosFor(day,id){
  fetch(BASE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({board:true,date:day})})
    .then(function(r){return r.json()})
    .then(function(res){
      if(!res||!res.ok)return;
      var q=res.queue||[],pos=null;
      for(var i=0;i<q.length;i++){if(q[i].id===id){pos=i+1;break}}
      if(pos){upsertBooking(day,day,id,pos);showDone({date:day,pos:pos})}
    }).catch(function(){});
}
</script>
</body>
</html>
