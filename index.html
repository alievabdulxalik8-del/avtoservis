<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Электронная очередь</title>
<style>
:root{--ink:#101820;--ink-2:#4A5964;--paper:#E8ECEF;--card:#fff;--line:#D4DBE0;
--blue:#17549E;--blue-bg:#E4EDF9;--amber:#B9740A;--amber-bg:#FCEFD8;
--green:#1B7048;--green-bg:#DDF0E6;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:21px;margin-bottom:2px}
.sub{color:var(--ink-2);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.pad{padding:16px}
.hd{padding:12px 16px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.n{width:34px;height:34px;border-radius:9px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 34px}
.n.work{background:var(--amber-bg);color:var(--amber)}
.n.done{background:var(--green-bg);color:var(--green)}
.nm{font-weight:700;font-size:15px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.p-wait{background:var(--blue-bg);color:var(--blue)}
.p-work{background:var(--amber-bg);color:var(--amber)}
.p-done{background:var(--green-bg);color:var(--green)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.info{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:14px 16px}
.info svg{flex:0 0 20px;margin-top:2px;stroke:var(--blue);fill:none;stroke-width:1.8}
label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
button{width:100%;font:inherit;font-size:16px;font-weight:700;padding:13px;border-radius:10px;border:none;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.err{color:#B02A2A;font-size:13px;margin-bottom:10px;display:none}
.done{display:none;text-align:center;padding:20px 4px}
.done .num{width:72px;height:72px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done h2{font-size:18px;margin-bottom:6px}
.done p{color:var(--ink-2);font-size:14px;margin-bottom:4px}
.done .lnk{display:inline-block;margin-top:14px;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline}
.refresh{font-size:12px;color:var(--ink-2);text-align:center;margin-top:6px}
.calhd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.calhd b{font-size:14px;text-transform:capitalize}
.calhd button{width:auto;padding:5px 10px;font-size:13px;background:var(--paper);color:var(--ink);font-weight:700}
.calwd{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 0;font-size:11px;color:var(--ink-3);text-align:center;font-weight:700}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 8px 12px}
.calcell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;position:relative;cursor:pointer;background:var(--paper);color:var(--ink-3)}
.calcell.avail{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.calcell.today{box-shadow:inset 0 0 0 2px var(--blue)}
.calcell.on{background:var(--blue);border-color:var(--blue);color:#fff}
.calcell.empty{visibility:hidden;cursor:default}
.calcell .dot{width:5px;height:5px;border-radius:50%;margin-top:2px;background:var(--ink-3)}
.calcell.avail .dot.free{background:var(--green)}
.calcell.avail .dot.mid{background:var(--amber)}
.calcell.avail .dot.busy{background:#B02A2A}
.calcell.on .dot{background:#fff!important}
.callegend{display:flex;gap:14px;padding:0 14px 12px;font-size:11px;color:var(--ink-2)}
.callegend span{display:inline-flex;align-items:center;gap:4px}
.callegend i{width:6px;height:6px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="shopName">Автосервис</h1>
  <div class="sub" id="shopSub">электронная очередь</div>

  <div class="card">
    <div class="info" id="infoBlock"></div>
  </div>

  <div class="card">
    <div class="calhd"><b id="calMonth">Выбор дня</b>
      <div style="display:flex;gap:6px">
        <button onclick="calShift(-7)">‹</button>
        <button onclick="calToday()">Сегодня</button>
        <button onclick="calShift(7)">›</button>
      </div>
    </div>
    <div class="calwd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="calgrid" id="calGrid"></div>
    <div class="callegend">
      <span><i style="background:var(--green)"></i>свободно</span>
      <span><i style="background:var(--amber)"></i>есть запись</span>
      <span><i style="background:#B02A2A"></i>плотно</span>
    </div>
  </div>

  <div class="card">
    <div class="hd"><span id="qTitle">Очередь</span><span id="qCount"></span></div>
    <div id="qList"></div>
  </div>
  <div class="refresh" id="refreshTxt"></div>

  <div class="card" style="margin-top:18px" id="form-card">
    <div class="pad">
      <label style="font-size:16px;margin-bottom:10px" id="formTitle">Хотите записаться?</label>
      <div class="err" id="err"></div>
      <input id="name" placeholder="Ваше имя">
      <input id="phone" type="tel" placeholder="Телефон">
      <input id="car" placeholder="Марка авто">
      <input id="plate" placeholder="Гос. номер (если знаете)">
      <textarea id="what" rows="2" placeholder="Что случилось"></textarea>
      <button id="submitBtn" onclick="submitForm()">Встать в очередь</button>
    </div>
  </div>

  <div class="card done" id="done">
    <div class="pad">
      <div class="num" id="posNum">—</div>
      <h2 id="doneH2">Вы записаны</h2>
      <p id="doneTxt">Ваша позиция в очереди на выбранный день</p>
      <span class="lnk" onclick="anotherDay()">Записаться на другой день</span>
    </div>
  </div>
</div>

<script>
var BASE_URL = 'https://script.google.com/macros/s/AKfycbyW17fICbE-GjMS_jMk9OaAVlONZEuKCWqsFUKB86emJzqq1WEtpUuEqTT15waLVGiAHQ/exec';
var LKEY = 'client_bookings_v1';
var selDate = null;
var lastDays = {};      // date -> count
var maxDate = null;     // дальше этой даты записи нет (сервер отдаёт данные только на месяц вперёд)
var calBase = new Date(); // с какой недели начинается видимая сетка
var submitting = false;

function esc(s){return String(s==null?'':s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
function iso(d){var x=d||new Date();return new Date(x.getTime()-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function uid(){return 'c'+Date.now()+Math.floor(Math.random()*900+100)}
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function ruShort(ds){
  var d=new Date(ds+'T00:00:00'),wd=['вс','пн','вт','ср','чт','пт','сб'][d.getDay()];
  return {num:d.getDate()+' '+MONTHS[d.getMonth()],wd:wd};
}
function dayLabel(ds){
  var t=iso(),tm=iso(new Date(Date.now()+864e5));
  if(ds===t)return 'сегодня';
  if(ds===tm)return 'завтра';
  var r=ruShort(ds);return r.wd+', '+r.num;
}

function myBookings(){
  try{return JSON.parse(localStorage.getItem(LKEY)||'{}')}catch(e){return {}}
}
function saveBooking(date,id,pos){
  var m=myBookings();m[date]={id:id,pos:pos};
  try{localStorage.setItem(LKEY,JSON.stringify(m))}catch(e){}
}
function clearBooking(date){
  var m=myBookings();delete m[date];
  try{localStorage.setItem(LKEY,JSON.stringify(m))}catch(e){}
}

/* ---------- КАЛЕНДАРЬ ---------- */
function mondayOf(d){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var wd=(x.getDay()+6)%7; // 0=пн
  x.setDate(x.getDate()-wd);
  return x;
}
function calShift(days){
  calBase=new Date(calBase.getTime()+days*864e5);renderCal();
}
function calToday(){calBase=new Date();renderCal()}

function renderCal(){
  var start=mondayOf(calBase);
  var today=iso();
  var cells=[],d=new Date(start);
  for(var i=0;i<28;i++){ // 4 недели видно за раз — достаточно для месяца вперёд
    cells.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  var firstDs=iso(cells[0]),lastDs=iso(cells[cells.length-1]);
  document.getElementById('calMonth').textContent=ruShort(iso(cells[7])).num.replace(/^\d+\s/,'');

  var html='';
  cells.forEach(function(cd){
    var ds=iso(cd);
    var avail=ds>=today;
    var cls='calcell'+(avail?' avail':'')+(ds===today?' today':'')+(ds===selDate?' on':'');
    var cnt=lastDays[ds]||0;
    var dotCls=cnt===0?'free':cnt<4?'mid':'busy';
    html+='<div class="'+cls+'"'+(avail?' onclick="pickDay(\''+ds+'\')"':'')+'>'+cd.getDate()+
      (avail?'<div class="dot '+dotCls+'"></div>':'')+'</div>';
  });
  document.getElementById('calGrid').innerHTML=html;
}

function pickDay(d){
  selDate=d;renderCal();load();updateFormState();
}
function anotherDay(){
  document.getElementById('done').style.display='none';
  document.getElementById('form-card').style.display='block';
  var dates=Object.keys(lastDays).sort();
  var next=dates.find(function(ds){return ds>=iso()&&!myBookings()[ds]});
  if(next)pickDay(next);
}

/* ---------- ОЧЕРЕДЬ И ФОРМА ---------- */
function render(data){
  var info=data.info||{};
  document.getElementById('shopName').textContent=info.name||'Автосервис';
  document.getElementById('shopSub').textContent=info.hours?('работаем: '+info.hours):'электронная очередь';
  var infoHtml='';
  if(info.hours) infoHtml+='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>Часы работы</b><br>'+esc(info.hours)+'</div>';
  if(info.phone) infoHtml+='</div><div class="info" style="border-top:1px solid var(--line)"><svg viewBox="0 0 24 24"><path d="M4 5c0 8 7 15 15 15l3-4-6-2-2 2c-3-1-6-4-7-7l2-2-2-6z"/></svg><div><b>Телефон</b><br><a href="tel:'+esc(info.phone)+'" style="color:var(--blue);text-decoration:none">'+esc(info.phone)+'</a></div>';
  document.getElementById('infoBlock').innerHTML=infoHtml||'<div>Добро пожаловать! Запишитесь ниже.</div>';

  if(data.days&&data.days.length){
    lastDays={};
    data.days.forEach(function(x){lastDays[x.date]=x.count});
    maxDate=data.days[data.days.length-1].date;
  }
  if(!selDate)selDate=data.day||iso();
  renderCal();

  document.getElementById('qTitle').textContent='Очередь на '+dayLabel(selDate);

  var q=data.queue||[];
  var qEl=document.getElementById('qList');
  document.getElementById('qCount').textContent=q.length?('всего: '+q.length):'';
  var lbl={wait:'Ждёт',work:'В работе',done:'Готово'},cl={wait:'',work:'work',done:'done'},pl={wait:'p-wait',work:'p-work',done:'p-done'};
  if(!q.length){qEl.innerHTML='<div class="empty">На этот день пока никто не записан</div>'}
  else{
    qEl.innerHTML=q.map(function(c,i){
      var s=c.status||'wait';
      return '<div class="row"><div class="n '+cl[s]+'">'+(i+1)+'</div>'+
        '<div style="flex:1"><div class="nm">'+esc(c.name)+(c.time?' <span style="font-weight:400;color:var(--ink-2);font-size:13px">· '+esc(c.time)+'</span>':'')+'</div></div>'+
        '<span class="pill '+pl[s]+'">'+lbl[s]+'</span></div>';
    }).join('');
  }
  document.getElementById('refreshTxt').textContent='обновляется автоматически';
  updateFormState();
}

function updateFormState(){
  var b=myBookings()[selDate];
  if(b){
    document.getElementById('form-card').style.display='none';
    document.getElementById('done').style.display='block';
    document.getElementById('posNum').textContent=b.pos||'—';
    document.getElementById('doneH2').textContent=b.pending?'Записываем…':'Вы записаны';
    document.getElementById('doneTxt').textContent='Ваша позиция в очереди на '+dayLabel(selDate);
  } else {
    document.getElementById('form-card').style.display='block';
    document.getElementById('done').style.display='none';
    document.getElementById('formTitle').textContent='Записаться на '+dayLabel(selDate);
  }
}

function load(){
  if(!BASE_URL||BASE_URL.indexOf('exec')<0){
    document.getElementById('qList').innerHTML='<div class="empty">Страница не подключена к базе</div>';return;
  }
  fetch(BASE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({board:true,date:selDate})})
    .then(function(r){return r.json()})
    .then(function(res){if(res&&res.ok)render(res)})
    .catch(function(){});
}
load();setInterval(load,15000);

function submitForm(){
  if(submitting)return; // защита от повторного нажатия, пока идёт отправка
  var name=document.getElementById('name').value.trim();
  var phone=document.getElementById('phone').value.trim();
  var err=document.getElementById('err');
  if(!name||!phone){err.textContent='Заполните имя и телефон.';err.style.display='block';return}
  if(!BASE_URL||BASE_URL.indexOf('exec')<0){err.textContent='Запись временно недоступна.';err.style.display='block';return}
  err.style.display='none';

  var id=uid(),day=selDate||iso();
  var rec={id:id,name:name,phone:phone,car:document.getElementById('car').value.trim(),
    plate:document.getElementById('plate').value.trim().toUpperCase(),
    date:day,time:'',what:document.getElementById('what').value.trim(),
    status:'wait',ord:Date.now(),updated:Date.now(),deleted:0};

  // Мгновенно, ещё до ответа сервера, прячем форму — без этого за пару секунд ожидания
  // можно было успеть отправить форму второй раз.
  submitting=true;
  saveBooking(day,id,'…');
  updateFormState();

  fetch(BASE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({board:true,date:day,queue:[rec]})})
    .then(function(r){return r.json()})
    .then(function(res){
      if(!res||!res.ok)throw new Error('fail');
      var q=(res.queue||[]);
      var realId=(res.idMap&&res.idMap[id])?res.idMap[id]:id;
      var pos=q.length;
      for(var i=0;i<q.length;i++){if(q[i].id===realId){pos=i+1;break}}
      saveBooking(day,id,pos);
      document.getElementById('name').value='';document.getElementById('phone').value='';
      document.getElementById('car').value='';document.getElementById('plate').value='';document.getElementById('what').value='';
      submitting=false;
      updateFormState();
      load();
    })
    .catch(function(){
      // не получилось — откатываем оптимистичную запись, показываем форму снова
      clearBooking(day);
      submitting=false;
      updateFormState();
      err.textContent='Не удалось отправить. Проверьте связь и попробуйте ещё раз.';err.style.display='block';
    });
}
</script>
</body>
</html>
