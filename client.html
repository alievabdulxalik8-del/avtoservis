<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Электронная очередь</title>
<style>
:root{--ink:#101820;--ink-2:#4A5964;--paper:#E8ECEF;--card:#fff;--line:#D4DBE0;
--blue:#17549E;--blue-bg:#E4EDF9;--amber:#B9740A;--amber-bg:#FCEFD8;
--green:#1B7048;--green-bg:#DDF0E6;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:21px;margin-bottom:2px}
.sub{color:var(--ink-2);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.pad{padding:16px}
.hd{padding:12px 16px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.n{width:34px;height:34px;border-radius:9px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 34px}
.n.work{background:var(--amber-bg);color:var(--amber)}
.n.done{background:var(--green-bg);color:var(--green)}
.nm{font-weight:700;font-size:15px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.p-wait{background:var(--blue-bg);color:var(--blue)}
.p-work{background:var(--amber-bg);color:var(--amber)}
.p-done{background:var(--green-bg);color:var(--green)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-2);font-size:14px}
.info{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:14px 16px}
.info svg{flex:0 0 20px;margin-top:2px;stroke:var(--blue);fill:none;stroke-width:1.8}
label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
button{width:100%;font:inherit;font-size:16px;font-weight:700;padding:13px;border-radius:10px;border:none;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.err{color:#B02A2A;font-size:13px;margin-bottom:10px;display:none}
.done{display:none;text-align:center;padding:20px 4px}
.done .num{width:72px;height:72px;border-radius:50%;background:var(--green-bg);color:var(--green);font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.done h2{font-size:18px;margin-bottom:6px}
.done p{color:var(--ink-2);font-size:14px}
.refresh{font-size:12px;color:var(--ink-2);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="shopName">Автосервис</h1>
  <div class="sub" id="shopSub">электронная очередь</div>

  <div class="card">
    <div class="info" id="infoBlock"></div>
  </div>

  <div class="card">
    <div class="hd"><span>Очередь сегодня</span><span id="qCount"></span></div>
    <div id="qList"></div>
  </div>
  <div class="refresh" id="refreshTxt"></div>

  <div class="card" style="margin-top:18px" id="form-card">
    <div class="pad">
      <label style="font-size:16px;margin-bottom:10px">Хотите записаться?</label>
      <div class="err" id="err"></div>
      <input id="name" placeholder="Ваше имя">
      <input id="phone" type="tel" placeholder="Телефон">
      <input id="car" placeholder="Марка авто">
      <input id="plate" placeholder="Гос. номер (если знаете)">
      <textarea id="what" rows="2" placeholder="Что случилось"></textarea>
      <button id="submitBtn" onclick="submitForm()">Встать в очередь</button>
    </div>
  </div>

  <div class="card done" id="done">
    <div class="pad">
      <div class="num" id="posNum">—</div>
      <h2>Вы записаны</h2>
      <p id="doneTxt">Ваша позиция в сегодняшней очереди</p>
    </div>
  </div>
</div>

<script>
var BASE_URL = 'https://script.google.com/macros/s/AKfycbzJat5sOG28_1h9PKPvlGdryltTxAG2rK49k8pQqbfL4VEsHN1maqhzR36XnObBkak-0Q/exec';

function esc(s){return String(s==null?'':s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
function iso(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function uid(){return 'c'+Date.now()+Math.floor(Math.random()*900+100)}

function render(data){
  var info=data.info||{};
  document.getElementById('shopName').textContent=info.name||'Автосервис';
  document.getElementById('shopSub').textContent=info.hours?('работаем: '+info.hours):'электронная очередь';
  var infoHtml='';
  if(info.hours) infoHtml+='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>Часы работы</b><br>'+esc(info.hours)+'</div>';
  if(info.phone) infoHtml+='</div><div class="info" style="border-top:1px solid var(--line)"><svg viewBox="0 0 24 24"><path d="M4 5c0 8 7 15 15 15l3-4-6-2-2 2c-3-1-6-4-7-7l2-2-2-6z"/></svg><div><b>Телефон</b><br><a href="tel:'+esc(info.phone)+'" style="color:var(--blue);text-decoration:none">'+esc(info.phone)+'</a></div>';
  document.getElementById('infoBlock').innerHTML=infoHtml||'<div>Добро пожаловать! Запишитесь ниже.</div>';

  var q=data.queue||[];
  var qEl=document.getElementById('qList');
  document.getElementById('qCount').textContent=q.length?('всего: '+q.length):'';
  var lbl={wait:'Ждёт',work:'В работе',done:'Готово'},cl={wait:'',work:'work',done:'done'},pl={wait:'p-wait',work:'p-work',done:'p-done'};
  if(!q.length){qEl.innerHTML='<div class="empty">Пока никто не записан — вы можете быть первым</div>'}
  else{
    qEl.innerHTML=q.map(function(c,i){
      var s=c.status||'wait';
      return '<div class="row"><div class="n '+cl[s]+'">'+(i+1)+'</div>'+
        '<div style="flex:1"><div class="nm">'+esc(c.name)+(c.time?' <span style="font-weight:400;color:var(--ink-2);font-size:13px">· '+esc(c.time)+'</span>':'')+'</div></div>'+
        '<span class="pill '+pl[s]+'">'+lbl[s]+'</span></div>';
    }).join('');
  }
  document.getElementById('refreshTxt').textContent='обновляется автоматически';
}

function load(){
  if(!BASE_URL||BASE_URL.indexOf('exec')<0){
    document.getElementById('qList').innerHTML='<div class="empty">Страница не подключена к базе</div>';return;
  }
  fetch(BASE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({board:true})})
    .then(function(r){return r.json()})
    .then(function(res){if(res&&res.ok)render(res)})
    .catch(function(){});
}
load();setInterval(load,15000);

function submitForm(){
  var name=document.getElementById('name').value.trim();
  var phone=document.getElementById('phone').value.trim();
  var err=document.getElementById('err');
  if(!name||!phone){err.textContent='Заполните имя и телефон.';err.style.display='block';return}
  if(!BASE_URL||BASE_URL.indexOf('exec')<0){err.textContent='Запись временно недоступна.';err.style.display='block';return}
  err.style.display='none';
  var btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Записываем…';

  var id=uid();
  var rec={id:id,name:name,phone:phone,car:document.getElementById('car').value.trim(),
    plate:document.getElementById('plate').value.trim().toUpperCase(),
    date:iso(),time:'',what:document.getElementById('what').value.trim(),
    status:'wait',ord:Date.now(),updated:Date.now(),deleted:0};

  fetch(BASE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({board:true,queue:[rec]})})
    .then(function(r){return r.json()})
    .then(function(res){
      var q=(res.queue||[]);
      var pos=1;
      for(var i=0;i<q.length;i++){if(q[i].id===id){pos=i+1;break}}
      document.getElementById('form-card').style.display='none';
      document.getElementById('done').style.display='block';
      document.getElementById('posNum').textContent=pos;
    })
    .catch(function(){
      err.textContent='Не удалось отправить. Проверьте связь и попробуйте ещё раз.';err.style.display='block';
      btn.disabled=false;btn.textContent='Встать в очередь';
    });
}
</script>
</body>
</html>
